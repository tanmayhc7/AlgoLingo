<!doctype html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<div class="wrap">
  <header class="top">
    <a class="brand" href="../index.html"><img src="../assets/logo.svg" alt="">Algolingo</a>

  </header>

  <section class="lesson-head">
    <p class="crumb" id="crumb"></p>

  </section>

  <div class="bench">

    <div class="panels" id="panels"></div>

  <div class="below">

      <div id="predict-body"></div>

    <section class="card trap" aria-labelledby="trap-h">

    <div class="table-wrap">
      <table>
        <tbody id="builtins"></tbody>
      </table>

  </section>

  <div class="outline" id="outline"></div>
  <nav class="pager" id="pager" aria-label="Lessons"></nav>
