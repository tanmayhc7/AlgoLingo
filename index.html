<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSA Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600;700&display=swap">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
<script src="assets/site.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="index.html"><img src="assets/logo.svg" alt="">DSA Visualizer</a>
    <button class="tool" id="theme" type="button">Dark mode</button>
  </header>

  <section class="hero">
    <div class="hero-copy">
      <h1>Watch the code run, and the memory move</h1>
      <p class="lede">Python and data structures for someone who thinks in C. Every lesson runs the same program in both languages, one line at a time, and shows what happens in memory.</p>
      <a class="cta" href="lessons/variables.html">Start with variables</a>
    </div>
    <div class="panel" data-lang="py" aria-label="Live demo: Python names are tags on objects">
      <header><h2>Python</h2><p>Tags on objects, running live</p></header>
      <ol class="code" id="hero-code"></ol>
      <svg class="stage show-addr" id="hero-stage" role="img" aria-label="Animated demo of tags pointing at objects"></svg>
    </div>
  </section>

  <div class="chapters" id="chapters"></div>
</div>

<script src="assets/chapters.js"></script>
<script src="assets/engine.js"></script>
<script>
Course.renderHome(document.getElementById('chapters'));
DSAV.hero(
  document.getElementById('hero-stage'),
  document.getElementById('hero-code'),
  ['a = 5', 'b = a', 'a = a + 1', 'del b'],
  [
    { pl: -1, py: [] },
    { pl: 0, py: [['obj', 'o1', 'int', '5'], ['bind', 'a', 'o1']] },
    { pl: 1, py: [['bind', 'b', 'o1']] },
    { pl: 2, py: [['obj', 'o2', 'int', '6'], ['bind', 'a', 'o2']] },
    { pl: 3, py: [['unbind', 'b']] }
  ]
);
</script>
</body>
</html>
